<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>PayGlow Support</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="https://unpkg.com/intasend-inlinejs-sdk@3.0.0/build/intasend-inline.js"></script>
  
  <style>
    body {
      font-family: Inter;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    
    /* BOX */
    .box {
      max-width: 320px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .08);
    }
    
    /* INPUT */
    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    
    /* BUTTON */
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    
    /* MARQUEE */
    .marquee {
      background: #0f172a;
      color: #fff;
      padding: 8px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    
    /* TOTAL */
    .total {
      font-size: 13px;
      color: #2563eb;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  
  <div class="box">
    
    <h3>Support This Project 💙</h3>
    
    <div class="marquee">
      <marquee id="donorFeed">Loading supporters...</marquee>
    </div>
    
    <div class="total" id="total">Loading total...</div>
    
    <input id="name" placeholder="Full Name">
    <input id="phone" placeholder="Phone (2547XXXXXXXX)">
    <input id="email" placeholder="Email">
    <input id="amount" type="number" placeholder="Amount (KES)">
    
    <div class="g-recaptcha" data-sitekey="6Ldpl5wsAAAAAFSiNv_hdn7db0YBlnqrQ0AJ9CaM"></div>
    
    <button onclick="pay()">Contribute</button>
    
  </div>
  
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzmZbGIdlz4VfuccG0ap5nvTvA7YqgWGR8dOekdSg49DSTfrCTGHOHORYGS-f93fa2p/exec";
    
    /* =========================
       VALIDATION
    ========================= */
    function validate() {
      
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const amount = Number(document.getElementById("amount").value);
      
      if (name.length < 3) return alert("Enter valid name");
      
      if (!/^2547\d{8}$/.test(phone))
        return alert("Phone must be 2547XXXXXXXX");
      
      if (!email.includes("@"))
        return alert("Invalid email");
      
      if (!amount || amount < 10)
        return alert("Minimum 10 KES");
      
      if (grecaptcha.getResponse().length === 0)
        return alert("Verify reCAPTCHA");
      
      return { name, phone, email, amount };
    }
    
    /* =========================
       PAYMENT
    ========================= */
    function pay() {
      
      const data = validate();
      if (!data) return;
      
      new window.IntaSend({
          publicAPIKey: "ISPubKey_live_79fff6a0-2a9e-4e38-b442-d00c56a58789",
          live: true
        })
        .on("COMPLETE", (res) => {
          
          /* SEND TO BACKEND */
          fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
              name: data.name,
              phone: data.phone,
              email: data.email,
              amount: data.amount,
              reference: res.invoice_id || Date.now(),
              status: "COMPLETE",
              recaptcha: grecaptcha.getResponse()
            })
          });
          
          alert("🎉 Payment successful!");
          
          grecaptcha.reset();
          
          loadFeed();
          
        })
        .on("FAILED", () => alert("Payment failed"))
        .run({
          amount: data.amount,
          currency: "KES",
          email: data.email,
          phone_number: data.phone,
          first_name: data.name
        });
      
    }
    
    /* =========================
       LOAD FEED + TOTAL
    ========================= */
    async function loadFeed() {
      
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        if (!Array.isArray(data)) return;
        
        let total = 0;
        
        /* TOTAL */
        data.forEach(d => total += Number(d.amount || 0));
        document.getElementById("total").innerText =
          "KES " + total + " raised";
        
        /* MARQUEE */
        const feed = data
          .slice(-10)
          .reverse()
          .map(d => `${d.name} donated KES ${d.amount}`)
          .join("   •   ");
        
        document.getElementById("donorFeed").innerText = feed;
        
      } catch {
        document.getElementById("donorFeed").innerText =
          "Supporters making impact 💙";
      }
    }
    
    loadFeed();
    setInterval(loadFeed, 5000);
  </script>
  
</body>

</html>
