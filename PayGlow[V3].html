<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PayGlow Support</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://unpkg.com/intasend-inlinejs-sdk@3.0.0/build/intasend-inline.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

/* BACKGROUND */
body{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#0f172a,#1e3a8a,#06b6d4);
  overflow:hidden;
}

/* GLOW EFFECT */
body::before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  background:radial-gradient(circle,#3b82f6,transparent);
  top:-100px;
  left:-100px;
  filter:blur(120px);
}

/* CARD */
.card{
  width:100%;
  max-width:340px;
  padding:24px;
  border-radius:20px;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,0.15);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.4),
    inset 0 0 20px rgba(255,255,255,0.05);

  color:#fff;
  text-align:center;

  animation:fadeIn .6s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* TITLE */
.card h2{
  font-size:20px;
  font-weight:700;
}

.card p{
  font-size:13px;
  color:#cbd5f5;
  margin-bottom:15px;
}

/* INPUTS */
.input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;

  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.05);

  color:#fff;
  font-size:13px;
}

.input::placeholder{
  color:#cbd5f5;
}

.input:focus{
  outline:none;
  border-color:#60a5fa;
}

/* PRESETS */
.presets{
  display:flex;
  gap:6px;
  margin-bottom:10px;
}

.presets button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;

  background:rgba(255,255,255,0.1);
  color:#fff;
  cursor:pointer;

  transition:.2s;
}

.presets button:hover{
  background:#2563eb;
}

/* BUTTON */
.btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:12px;

  background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:#fff;

  font-weight:600;
  font-size:14px;

  cursor:pointer;

  transition:.25s;
  position:relative;
  overflow:hidden;
}

/* SHIMMER */
.btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;

  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.4),
    transparent
  );

  transition:.6s;
}

.btn:hover::before{
  left:100%;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(6,182,212,0.5);
}

.btn:active{
  transform:scale(0.96);
}

/* MARQUEE */
.marquee{
  font-size:12px;
  margin-bottom:10px;
  color:#93c5fd;
}

/* FOOTER */
.footer{
  margin-top:12px;
  font-size:11px;
  color:#94a3b8;
}
</style>
</head>

<body>

<div class="card">

  <!-- LIVE FEED -->
  <div id="donorMarquee" class="marquee">
    Loading supporters...
  </div>

  <h2>Support This Project 💙</h2>
  <p>Your contribution keeps innovation alive 🚀</p>

  <div class="presets">
    <button onclick="setAmount(50)">50</button>
    <button onclick="setAmount(100)">100</button>
    <button onclick="setAmount(250)">250</button>
    <button onclick="setAmount(500)">500</button>
  </div>

  <input id="amount" class="input" type="number" placeholder="Amount (KES)">
  <input id="name" class="input" placeholder="Your name (optional)">
  <input id="email" class="input" placeholder="Email">
  <input id="phone" class="input" placeholder="Phone (2547XXXXXXXX)">

  <div class="g-recaptcha" data-sitekey="6Ldpl5wsAAAAAFSiNv_hdn7db0YBlnqrQ0AJ9CaM"></div>

  <button class="btn" onclick="pay()">Contribute Now</button>

  <div class="footer">
    🔒 Secure payments powered by IntaSend
  </div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyLbf8UUuK8Sq4T-2IdhF950H_eewT5HiqgEFn_n3ocOQaxcYQ8f8VcjSkHGkt-v5Z_lg/exec";

/* SET AMOUNT */
function setAmount(v){
  document.getElementById("amount").value=v;
}

/* PAYMENT */
function pay(){

  const amount=document.getElementById("amount").value;
  const email=document.getElementById("email").value;
  const phone=document.getElementById("phone").value;
  const name=document.getElementById("name").value||"Anonymous";

  if(!amount||amount<10)return alert("Minimum 10 KES");
  if(!email.includes("@"))return alert("Valid email required");
  if(!phone)return alert("Phone required");

  if(typeof grecaptcha==="undefined"||!grecaptcha.getResponse()){
    alert("Verify captcha");
    return;
  }

  new window.IntaSend({
    publicAPIKey:"ISPubKey_live_79fff6a0-2a9e-4e38-b442-d00c56a58789",
    live:true
  })
  .on("COMPLETE",(res)=>{

    fetch(API_URL,{
      method:"POST",
      body:JSON.stringify({
        name,email,phone,amount,
        reference:res.invoice_id,
        status:"COMPLETE",
        captcha:grecaptcha.getResponse()
      })
    });

    alert("🎉 Payment successful!");
    grecaptcha.reset();
    fetchDonors();

  })
  .run({amount,currency:"KES",email});
}

/* MARQUEE */
async function fetchDonors(){
  try{
    const r=await fetch(API_URL);
    const d=await r.json();

    if(Array.isArray(d)){
      const txt=d.slice(-8).reverse().map(x=>
        `💙 ${x.name||"Someone"} donated ${x.amount}`
      ).join(" • ");

      document.getElementById("donorMarquee").innerHTML=
        `<marquee>${txt}</marquee>`;
    }
  }catch{
    document.getElementById("donorMarquee").innerText="Be the first 💙";
  }
}

fetchDonors();
setInterval(fetchDonors,7000);
</script>

</body>
</html>
