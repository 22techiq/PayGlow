<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PayGlow Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:Inter;
  margin:0;
  background:#f1f5f9;
  padding:20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

h2{
  margin:0;
}

.btn{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:#fff;
  cursor:pointer;
}

/* STATS */
.stats{
  display:flex;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.card{
  flex:1;
  min-width:160px;
  background:#fff;
  padding:15px;
  border-radius:12px;
  box-shadow:0 6px 15px rgba(0,0,0,.06);
}

.card h4{
  margin:0;
  font-size:13px;
  color:#64748b;
}

.card p{
  font-size:18px;
  font-weight:600;
  margin:5px 0 0;
}

/* TABLE */
.table-wrap{
  overflow-x:auto;
  background:#fff;
  border-radius:12px;
  box-shadow:0 6px 15px rgba(0,0,0,.06);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th, td{
  padding:10px;
  text-align:left;
  white-space:nowrap;
}

th{
  background:#0f172a;
  color:#fff;
}

tr:nth-child(even){
  background:#f8fafc;
}

/* FOOTER */
.footer{
  margin-top:15px;
  font-size:11px;
  color:#64748b;
  text-align:center;
}
</style>
</head>

<body>

<div class="header">
  <h2>📊 PayGlow Admin</h2>
  <button class="btn" onclick="downloadPDF()">Download PDF</button>
</div>

<div class="stats">
  <div class="card">
    <h4>Total Raised</h4>
    <p id="total">KES 0</p>
  </div>
  <div class="card">
    <h4>Total Donations</h4>
    <p id="count">0</p>
  </div>
</div>

<div class="table-wrap">
<table id="table">
  <thead>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Amount</th>
      <th>Date</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<div class="footer">
  © 2026 PayGlow — Secure Dashboard
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxXR8uvb7_bp1W757w7S1xGEboKgaM-CpceHQoeyeH1N70XHuH3ddlpNktUNb1VuJqN/exec";

/* =========================
   MASKING FUNCTIONS
========================= */
function maskEmail(email){
  if(!email.includes("@")) return email;

  let [name, domain] = email.split("@");

  if(name.length <= 4){
    return name + "***@" + domain;
  }

  return name.slice(0,4) + "***@" + domain;
}

function maskPhone(phone){
  if(phone.length < 10) return phone;

  const start = phone.slice(0,5);   // 25471
  const end = phone.slice(-3);      // 900

  return start + "***" + end;
}

/* =========================
   LOAD DATA
========================= */
async function loadData(){

  try{

    const res = await fetch(API_URL);
    const data = await res.json();

    let total = 0;

    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";

    data.reverse().forEach((d,i)=>{

      total += Number(d.amount || 0);

      const row = `
        <tr>
          <td>${i+1}</td>
          <td>${d.name}</td>
          <td>${maskEmail(d.email || "")}</td>
          <td>${maskPhone(d.phone || "")}</td>
          <td>KES ${d.amount}</td>
          <td>${new Date(d.date).toLocaleString()}</td>
        </tr>
      `;

      tbody.innerHTML += row;
    });

    document.getElementById("total").innerText = "KES " + total;
    document.getElementById("count").innerText = data.length;

  }catch(err){
    console.error(err);
  }
}

/* =========================
   DOWNLOAD PDF
========================= */
function downloadPDF(){
  window.open(API_URL + "?type=pdf","_blank");
}

/* AUTO REFRESH */
loadData();
setInterval(loadData,5000);

</script>



</body>
</html>
