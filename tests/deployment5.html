<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PayGlow Support</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://unpkg.com/intasend-inlinejs-sdk@3.0.0/build/intasend-inline.js"></script>

<style>
body{
  font-family:Inter;
  background:#f1f5f9;
  margin:0;
  padding:20px;
  text-align:center;
}

.box{
  max-width:340px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h3{
  margin-bottom:10px;
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

.marquee{
  background:#0f172a;
  color:#fff;
  padding:8px;
  font-size:12px;
  margin-bottom:10px;
  border-radius:6px;
}

.total{
  font-size:13px;
  color:#2563eb;
  margin-bottom:10px;
  font-weight:600;
}

.status{
  font-size:12px;
  margin-top:8px;
  color:#16a34a;
}
</style>
</head>

<body>

<div class="box">

<h3>Support This Project 💙</h3>

<div class="marquee">
  <marquee id="donorFeed">Loading supporters...</marquee>
</div>

<div class="total" id="total">Loading total...</div>

<input id="name" placeholder="Full Name">
<input id="phone" placeholder="2547XXXXXXXX">
<input id="email" placeholder="Email">
<input id="amount" type="number" placeholder="Amount (KES)">

<div class="g-recaptcha" data-sitekey="YOUR_SITE_KEY"></div>

<button id="payBtn" onclick="pay()">Contribute</button>

<div class="status" id="status"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyQ4-k9IB6smSfmNxTwCor0w10BOJ6hkKkE7rCGaOG8azcVjUdul71ogHkCk1-i9Ibp/exec";

/* =========================
   VALIDATION
========================= */
function validate(){

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if(name.length < 3){
    alert("Enter valid name");
    return null;
  }

  if(!/^2547\d{8}$/.test(phone)){
    alert("Phone must be 2547XXXXXXXX");
    return null;
  }

  if(!email.includes("@")){
    alert("Invalid email");
    return null;
  }

  if(!amount || amount < 10){
    alert("Minimum 10 KES");
    return null;
  }

  if(grecaptcha.getResponse().length === 0){
    alert("Verify reCAPTCHA");
    return null;
  }

  return {name,phone,email,amount};
}

/* =========================
   PAYMENT
========================= */
function pay(){

  const data = validate();
  if(!data) return;

  const btn = document.getElementById("payBtn");
  const status = document.getElementById("status");

  btn.disabled = true;
  status.innerText = "⏳ Initiating payment...";

  new window.IntaSend({
    publicAPIKey: "YOUR_PUBLIC_KEY",
    live: true
  })
  .on("COMPLETE", (res)=>{

    /* 🚨 NO BACKEND SAVE HERE */
    status.innerText = "⏳ Payment received. Confirming...";

    grecaptcha.reset();

    /* 🔄 Wait for webhook */
    setTimeout(loadFeed, 3000);

    btn.disabled = false;

  })
  .on("FAILED", ()=>{
    status.innerText = "❌ Payment failed";
    btn.disabled = false;
  })
  .run({
    amount: data.amount,
    currency: "KES",
    email: data.email,
    phone_number: data.phone,
    first_name: data.name
  });

}

/* =========================
   LOAD FEED + TOTAL
========================= */
async function loadFeed(){

  try{

    const res = await fetch(API_URL);
    const data = await res.json();

    if(!Array.isArray(data)) return;

    let total = 0;

    data.forEach(d => total += Number(d.amount || 0));

    document.getElementById("total").innerText =
      "KES " + total + " raised";

    const feed = data
      .slice(-10)
      .reverse()
      .map(d => `${d.name} donated KES ${d.amount}`)
      .join("   •   ");

    document.getElementById("donorFeed").innerText = feed;

  }catch{
    document.getElementById("donorFeed").innerText =
      "Supporters making impact 💙";
  }
}

/* AUTO REFRESH */
loadFeed();
setInterval(loadFeed,5000);

</script>

</body>
</html>
