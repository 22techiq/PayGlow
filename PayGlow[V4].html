<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PayGlow Support</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://unpkg.com/intasend-inlinejs-sdk@3.0.0/build/intasend-inline.js"></script>

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#1e3a8a,#06b6d4);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* CARD */
.card{
  width:90%;
  max-width:340px;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  color:#fff;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
}

/* MARQUEE */
.marquee{
  font-size:12px;
  opacity:0.9;
  margin-bottom:8px;
}

/* TITLE */
h2{margin:5px 0;}
p{font-size:13px;color:#e2e8f0;}

/* PRESETS */
.presets{
  display:flex;
  gap:6px;
  margin:10px 0;
}
.presets button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.2);
  color:#fff;
  cursor:pointer;
}
.presets button.active{
  background:#2563eb;
}

/* INPUTS */
input{
  width:80%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  outline:none;
}

/* BUTTON */
button.pay{
  width:90%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-weight:600;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
}

/* TOTAL */
.total{
  font-size:12px;
  margin-bottom:8px;
  color:#93c5fd;
}

/* recaptcha fix */
.g-recaptcha{
  display:flex;
  justify-content:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">

  <div class="marquee">
    <marquee id="donorMarquee">Loading supporters...</marquee>
  </div>

  <h2>Support This Project 💙</h2>
  <p>Your contribution keeps innovation alive 🚀</p>

  <div class="total" id="totalRaised">Loading total...</div>

  <!-- PRESETS -->
  <div class="presets">
    <button onclick="setAmount(50,this)">50</button>
    <button onclick="setAmount(100,this)">100</button>
    <button onclick="setAmount(250,this)">250</button>
    <button onclick="setAmount(500,this)">500</button>
  </div>

  <!-- INPUTS -->
  <input id="amount" type="number" placeholder="Amount (KES)">
  <input id="name" placeholder="Your Name">
  <input id="email" type="email" placeholder="Email">
  <input id="phone" placeholder="Phone (07XXXXXXXX)">

  <!-- CAPTCHA -->
  <div class="g-recaptcha" data-sitekey="6Ldpl5wsAAAAAFSiNv_hdn7db0YBlnqrQ0AJ9CaM"></div>

  <!-- BUTTON -->
  <button class="pay" onclick="pay()">Contribute Now</button>

  <p style="font-size:11px;margin-top:10px;">🔒 Secure payments powered by IntaSend</p>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyLbf8UUuK8Sq4T-2IdhF950H_eewT5HiqgEFn_n3ocOQaxcYQ8f8VcjSkHGkt-v5Z_lg/exec";

/* =========================
   SET AMOUNT
========================= */
function setAmount(val,el){
  document.getElementById("amount").value=val;
  document.querySelectorAll(".presets button")
    .forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
}

/* =========================
   VALIDATION
========================= */
function validate(){

  const amount=document.getElementById("amount").value;
  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const phone=document.getElementById("phone").value.trim();

  if(!amount || amount<10) return "Minimum amount is 10 KES";
  if(name.length<2) return "Enter valid name";
  if(!email.includes("@")) return "Invalid email";
  if(!/^07\d{8}$/.test(phone)) return "Invalid phone (07XXXXXXXX)";

  if(grecaptcha.getResponse().length===0)
    return "Please verify captcha";

  return null;
}

/* =========================
   PAYMENT
========================= */
function pay(){

  const error=validate();
  if(error) return alert(error);

  const amount=document.getElementById("amount").value;
  const name=document.getElementById("name").value;
  const email=document.getElementById("email").value;
  const phone=document.getElementById("phone").value;

  new window.IntaSend({
    publicAPIKey:"ISPubKey_live_79fff6a0-2a9e-4e38-b442-d00c56a58789",
    live:true
  })
  .on("COMPLETE",(res)=>{

    alert("🎉 Payment successful!");

    /* SEND TO BACKEND */
    fetch(API_URL,{
      method:"POST",
      body:JSON.stringify({
        name,email,phone,amount,
        reference:res.invoice_id || Date.now(),
        captcha: grecaptcha.getResponse()
      })
    });

    fetchStats();

  })
  .on("FAILED",()=>alert("Payment failed"))
  .run({
    amount:amount,
    currency:"KES",
    email:email,
    phone_number:phone   // 👈 PREFILLS MPESA SCREEN
  });
}

/* =========================
   FETCH DATA (TOTAL + MARQUEE)
========================= */
async function fetchStats(){

  try{
    const res=await fetch(API_URL);
    const data=await res.json();

    if(Array.isArray(data)){

      let total=0;
      let text="";

      data.slice(-10).reverse().forEach(d=>{
        total+=Number(d.amount);
        text += `${d.name} donated KES ${d.amount} 💙   `;
      });

      document.getElementById("totalRaised").innerText =
        "KES "+total+" raised";

      document.getElementById("donorMarquee").innerText =
        text || "Be the first supporter 💙";
    }

  }catch{
    document.getElementById("donorMarquee").innerText =
      "Supporters active 💙";
  }
}

fetchStats();
setInterval(fetchStats,5000);
</script>

</body>
</html>
